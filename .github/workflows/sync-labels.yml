name: Sync standard labels

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repository (e.g. NaaBTech/.github)'
        required: true
        default: 'NaaBTech/.github'
        type: string
      dry_run:
        description: 'Preview changes without calling the GitHub API'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Run label synchronization
        env:
          TARGET_REPO: ${{ inputs.repo }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.ORG_LABELS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--repo "${TARGET_REPO}")
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/sync_labels.py "${args[@]}"
