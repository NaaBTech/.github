name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main

# The workflow only reads the repository. It needs no write access and no secrets.
permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements-docs.txt

      - name: Check YAML syntax and style
        run: yamllint --strict --config-file .yamllint.yml .

      - name: Check file naming, form schema, and internal links
        run: python scripts/validate_docs.py .

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Check Markdown formatting
        run: |
          npm install --global --no-fund --no-audit markdownlint-cli@0.45.0
          markdownlint --config .markdownlint.json "**/*.md"
