name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly full-history scan, Monday 04:00 UTC.
    - cron: '0 4 * * 1'

# The workflow only reads this repository. It needs no write access and no secrets.
permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

# This workflow validates the files in the .github repository itself.
#
# GitHub does not inherit workflow files between repositories the way it
# inherits community health files. A workflow in .github/workflows runs only in
# the repository that contains it. Every project that needs CI has its own
# workflow file in its own .github/workflows directory.
#
# This workflow is not a reusable workflow: it does not declare
# on: workflow_call, so other repositories cannot call it. Making it reusable
# would require deliberate adaptation, because it validates this repository's
# own files and assumes their paths exist. See REPOSITORY_ONBOARDING.md.

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this workflow pushes, commits, or talks to the API, so
          # the token does not need to be persisted in the local git config.
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the committed files for secrets
        # The files that are committed are scanned. The values are redacted, so
        # a finding never puts a credential into the log.
        run: gitleaks detect --source . --no-git --redact --no-banner --verbose

      - name: Scan the commits of a pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          gitleaks git --redact --no-banner --log-opts "${base}..${head}" --verbose

      - name: Scan the commits of a push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            gitleaks git --redact --no-banner --log-opts "--all" --verbose
          else
            gitleaks git --redact --no-banner --log-opts "${before}..${after}" --verbose
          fi

      - name: Scan the full reachable history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks git --redact --no-banner --log-opts "--all" --verbose

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement requirements-docs.txt

      - name: Check YAML syntax and style
        run: yamllint --strict --config-file .yamllint.yml .

      - name: Check spelling
        run: codespell --check-hidden

      - name: Check the Python scripts
        run: ruff check scripts/

      - name: Check the validator's own tests
        run: python scripts/test_validate_docs.py

      - name: Check file naming, form schema, and internal links
        run: python scripts/validate_docs.py .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Markdown linting tooling
        # `npm ci` installs exactly the tree recorded in package-lock.json.
        run: npm ci --no-fund --no-audit

      - name: Check Markdown formatting
        run: npx --no-install markdownlint --config .markdownlint.json "**/*.md"
