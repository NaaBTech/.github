name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main

# The workflow only reads this repository. It needs no write access and no secrets.
permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

# This workflow validates the files in the .github repository itself.
#
# GitHub does not inherit workflow files between repositories the way it
# inherits community health files. A workflow in .github/workflows runs only in
# the repository that contains it. Every project that needs CI has its own
# workflow file in its own .github/workflows directory.
#
# This workflow is not a reusable workflow: it does not declare
# on: workflow_call, so other repositories cannot call it. Making it reusable
# would require deliberate adaptation, because it validates this repository's
# own files and assumes their paths exist. See REPOSITORY_ONBOARDING.md.
jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Nothing in this workflow pushes, commits, or talks to the API, so
          # the token does not need to be persisted in the local git config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements-docs.txt

      - name: Check YAML syntax and style
        run: yamllint --strict --config-file .yamllint.yml .

      - name: Check spelling
        run: codespell --check-hidden

      - name: Check the validator's own tests
        run: python scripts/test_validate_docs.py

      - name: Check file naming, form schema, and internal links
        run: python scripts/validate_docs.py .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Markdown linting tooling
        # `npm ci` installs exactly the tree recorded in package-lock.json.
        run: npm ci --no-fund --no-audit

      - name: Check Markdown formatting
        run: npx --no-install markdownlint --config .markdownlint.json "**/*.md"
