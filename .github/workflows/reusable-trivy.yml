name: Vulnerability scanning

on:
  workflow_call:
    inputs:
      scan-type:
        description: Type of scan to perform (fs, image, or repo)
        type: string
        default: 'fs'
        required: false
      severity:
        description: Severities to report
        type: string
        default: 'CRITICAL,HIGH'
        required: false

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@512607106093845b5969e0e5a1b3be0c8ad9a6e6  # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: '.'
          format: 'table'
          severity: ${{ inputs.severity }}
          exit-code: '0'
