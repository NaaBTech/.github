name: First interaction

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Welcome contributor
        uses: actions/first-interaction@1114b8964e16d9e03d47ad90e38a2c2eb6fa1544  # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            Thank you for opening an issue with NaaB Tech! Our maintainers will review
            your submission. Please ensure you have reviewed our Code of Conduct.
          pr-message: >-
            Thank you for your pull request! We appreciate your contribution to NaaB Tech.
            Please ensure all checks pass and that your contribution follows our
            Contributing Guidelines.
