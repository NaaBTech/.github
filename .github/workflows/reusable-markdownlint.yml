name: Reusable Markdownlint

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to the markdownlint configuration file'
        required: false
        type: string
        default: '.markdownlint.json'
      glob:
        description: 'Glob pattern for Markdown files to lint'
        required: false
        type: string
        default: '**/*.md'

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Run markdownlint
        env:
          LINT_CONFIG: ${{ inputs.config }}
          LINT_GLOB: ${{ inputs.glob }}
        run: |
          set -euo pipefail
          args=(--yes markdownlint-cli@0.50.1)
          if [ -f "${LINT_CONFIG}" ]; then
            args+=(--config "${LINT_CONFIG}")
          fi
          npx "${args[@]}" "${LINT_GLOB}"
