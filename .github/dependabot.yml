# The pinned dependencies are kept current by Dependabot. The versions are
# pinned so that a local run and the CI run use the same ones, so an update
# is reviewed like any other change rather than merged blindly.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action*"
    ignore:
      # v2.6.0 GHCR image manifests return 404 (ossf/scorecard-action#1752).
      - dependency-name: "ossf/scorecard-action"
        versions: ["= 2.6.0"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
